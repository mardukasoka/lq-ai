<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legal Firm</title><style>
body{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;max-width:760px;margin:0 auto;padding:28px 18px;line-height:1.55;background:#fafafa;color:#171717}
a{color:inherit}pre{white-space:pre-wrap;word-wrap:break-word;font:inherit}nav{margin-bottom:2rem}.error{color:#800}
</style></head><body><nav><a href="./">← Legal Firm Directory</a></nav><pre id="content">Loading…</pre>
<script>
const allowed=new Set(["general-counsel","corporate-commercial","ip-data","ai-regulation","employment-agent-economy","disputes-evidence","legal-operations","open-source","escalation"]);
const p=new URLSearchParams(location.search).get("p");
const el=document.querySelector("#content");
if(!allowed.has(p)){el.textContent="Unknown practice group.";el.className="error";}
else fetch("text/"+p+".txt").then(r=>{if(!r.ok)throw Error(r.status);return r.text()}).then(t=>el.textContent=t).catch(()=>{el.textContent="Page could not be loaded.";el.className="error"});
</script></body></html>
